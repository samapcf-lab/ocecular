  --focus:#0b6fb8;--shadow:0 1px 2px rgba(22,22,29,.05),0 8px 24px rgba(22,22,29,.06);
  --pink:#c2185b;--cyan:#0b6fb8;--lime:#3f7d0c;--orange:#b45309;
  --heading:"Source Sans 3","Segoe UI",system-ui,sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--size:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font:var(--size)/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body.large{--size:20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:9px 15px;background:var(--card);color:var(--ink);font-weight:600;line-height:1.25}
button:hover{background:var(--soft)}
button:disabled{cursor:not-allowed;opacity:.55}
.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.primary:hover{background:var(--ink-hover)}
.clay{background:var(--clay);border-color:var(--clay);color:var(--paper)}
.clay:hover{filter:brightness(1.07);background:var(--clay)}
.quiet{border-color:transparent;background:transparent;padding-inline:8px}
.quiet:hover{background:var(--soft)}
.small{min-height:36px;padding:6px 11px;font-size:.85em}
a{color:var(--clay-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:12px;top:-80px;background:var(--card);padding:10px;z-index:50}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--heading);font-weight:500;font-size:2.1em;line-height:1.12;letter-spacing:-.03em}
h2{font-family:var(--heading);font-weight:500;font-size:1.4em;line-height:1.25;letter-spacing:-.02em}
h3{font-size:1.05em;line-height:1.3;font-weight:700}
p{margin:0}
h1:focus,h2:focus{outline:none}
.eyebrow{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--clay-ink)}
.muted{color:var(--muted)}
.fine{font-size:.82em;color:var(--muted);line-height:1.45}
.stack{display:grid;gap:12px;min-width:0}
.stack-lg{display:grid;gap:24px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}

/* Demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.demobar-in{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.wordmark{font-weight:800;font-size:22px;letter-spacing:-1px;line-height:1;display:flex;align-items:baseline;gap:10px}
.wordmark span.dot{color:var(--clay)}
.wordmark small{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.roles{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.roles button{border:0;background:transparent;min-height:38px;padding:6px 12px;font-size:14px}
.roles button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.notice-strip{max-width:1180px;margin:10px auto 0;font-size:13px;color:var(--muted);text-align:center}

/* Guide */
.guide{max-width:1040px;margin:28px auto 0;display:grid;gap:40px}
.guide-hero{display:grid;gap:14px;max-width:720px}
.guide-hero h1{font-size:2.6em}
.lede{font-size:1.12em;color:var(--muted);max-width:62ch}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pillar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:8px;align-content:start}
.pillar .icon{color:var(--clay-ink)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{text-align:left;display:grid;gap:6px;align-content:start;padding:18px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:400}
.person:hover{border-color:var(--clay)}
.person[aria-pressed="true"]{border:2px solid var(--clay);padding:17px}
.person .chip{white-space:normal;justify-self:start;text-align:left}
.person .who{font-weight:700;font-size:1.05em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74em;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink);line-height:1.4;white-space:nowrap}
.chip.clay{background:var(--clay-tint);color:var(--clay-ink);filter:none}
.chip.good{background:var(--good-tint);color:var(--good)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip.crit{background:var(--crit-tint);color:var(--crit)}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.boundary{border-left:3px solid var(--clay);padding:4px 0 4px 16px;display:grid;gap:6px;max-width:72ch}

/* Phone app */
.app{max-width:440px;margin:20px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:clip;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:720px}
.app-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.app-brand{font-weight:800;font-size:26px;letter-spacing:-1.4px;line-height:1}
.app-brand span{color:var(--clay)}
.app-sub{font-size:11px;color:var(--muted);margin-top:3px}
.icon-btn{width:44px;padding:0;display:grid;place-items:center;border-radius:50%}
.icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;display:block}
.context{padding:12px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px;background:var(--card)}
.context label{font-size:13px;color:var(--muted)}
select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;font-weight:600;max-width:100%}
.app-main{padding:22px 20px 28px;flex:1;display:grid;gap:22px;align-content:start;min-width:0}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{border:0;border-radius:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;color:var(--muted);min-height:58px;position:relative}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"]::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--clay)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--clay);color:var(--paper);font-size:11px;line-height:18px;padding:0 5px}
.hero{text-align:center;display:grid;gap:10px;justify-items:center}
.hero h1{font-size:2.35em;max-width:12ch}
.hero p{color:var(--muted);max-width:34ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.card.dark{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.card.dark .eyebrow{color:var(--clay-tint)}
.card.dark .muted{color:var(--on-ink);opacity:.8}
.card.flag{border:2px solid var(--crit);background:var(--crit-tint)}
.card.note{background:var(--soft);border-color:transparent}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;display:grid;gap:6px;align-content:start;padding:14px;border-radius:12px;font-weight:400;min-height:118px}
.tile .t{font-weight:700}
.tile .s{font-size:.82em;color:var(--muted);line-height:1.35}
.list{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82em;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.filters button{white-space:nowrap;min-height:38px;padding:6px 12px;border-radius:999px;font-size:.85em}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
input[type="search"],input[type="text"],input[type="date"],textarea,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 11px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.field{display:grid;gap:5px}
.field > span{font-size:.85em;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92em;line-height:1.4}
.check input{width:20px;height:20px;margin-top:1px;flex-shrink:0;accent-color:var(--clay)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:.9em;min-height:32px;display:flex;align-items:center}
.sessions{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.sessions li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;font-size:.92em;border-bottom:1px solid var(--line);padding:6px 0}
.sessions li:last-child{border-bottom:0}
.progress{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--clay)}
.art{aspect-ratio:16/9;max-width:100%;border-radius:10px;display:grid;place-items:center;color:#fbf5ee;position:relative;overflow:hidden}
.art .icon{width:34px;height:34px;stroke-width:1.4}
.art .len{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:700;background:rgba(20,12,15,.55);padding:2px 7px;border-radius:6px}
.art .ai{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;background:rgba(20,12,15,.55);padding:2px 7px;border-radius:6px;letter-spacing:.04em}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.media{display:grid;gap:6px;text-align:left;font-weight:400;padding:0;border:0;background:transparent;border-radius:10px}
.media:hover{background:transparent}
.media .t{font-weight:700;line-height:1.25}
.player{display:grid;gap:8px}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--clay)}
.playing .bar span{animation:play 12s linear forwards}
@keyframes play{to{width:100%}}
@media (prefers-reduced-motion:reduce){.playing .bar span{animation:none;width:35%}}
.thread{display:grid;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:.95em;line-height:1.4;display:grid;gap:3px}
.msg .by{font-size:.74em;font-weight:700;color:var(--muted)}
.msg.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;justify-self:start}
.msg.me{background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px;justify-self:end}
.msg.me .by{color:var(--on-ink);opacity:.75}
.msg.helper{background:var(--clay-tint);border:1px dashed var(--clay);justify-self:stretch;max-width:100%;border-radius:12px}
.msg.helper .by{color:var(--clay-ink)}
.msg.system{justify-self:center;background:transparent;font-size:.8em;color:var(--muted);text-align:center;padding:2px 8px}
.helper-chips{display:flex;gap:6px;flex-wrap:wrap}
.helper-chips button{min-height:36px;padding:6px 11px;font-size:.85em;border-style:dashed;border-color:var(--clay);color:var(--clay-ink);background:transparent}
.composer{display:grid;gap:8px}
.under18{font-size:.8em;background:var(--warn-tint);color:var(--warn);padding:8px 12px;border-radius:8px;line-height:1.4}

/* Workspace views */
.workspace{max-width:1180px;margin:24px auto 0;display:grid;gap:20px}
.ws-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end}
.ws-tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.ws-tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;padding:10px 14px;color:var(--muted);position:relative}
.ws-tabs button[aria-pressed="true"]{color:var(--ink);background:var(--card);box-shadow:inset 0 -3px 0 var(--clay)}
.ws-tabs .count{margin-left:6px;background:var(--clay);color:var(--paper);border-radius:9px;padding:0 6px;font-size:12px}
.ws-grid{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:start}
.caseload{display:grid;gap:8px}
.case{text-align:left;display:grid;gap:3px;font-weight:400;padding:12px 14px}
.case[aria-pressed="true"]{border:2px solid var(--clay);padding:11px 13px}
.case .n{font-weight:700}
.queue{display:grid;gap:12px}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.table-wrap{overflow-x:auto}
@media (max-width:760px){.ws-grid{grid-template-columns:minmax(0,1fr)}.guide-hero h1{font-size:2.1em}}
@media (max-width:400px){.media-grid,.tiles{grid-template-columns:1fr}.app{border-radius:14px}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:15px;box-shadow:var(--shadow);z-index:40;max-width:min(92vw,460px);text-align:center}
.toast[hidden]{display:none}


.head-actions{flex-wrap:nowrap;flex-shrink:0}
.help-btn{display:inline-flex;gap:6px;align-items:center}
.help-btn .icon{width:18px;height:18px}
.who-sees p{display:flex;gap:10px;align-items:flex-start}
.who-sees .icon{width:18px;height:18px;margin-top:1px;color:var(--clay-ink)}
.show-sm{display:none}
.ctx-row{flex-wrap:nowrap}
.ctx-row > span{min-width:0}
.ctx-row select{min-width:0}

@media (max-width:640px){
  .demobar{position:static}.demobar-in{gap:6px 8px}.wordmark{order:1}#end-btn{order:2;margin-left:auto}
  .demobar .roles{order:3;flex-basis:100%}
  .roles{flex-wrap:nowrap;overflow-x:auto;max-width:100%}.roles button{white-space:nowrap;padding:6px 10px}.wordmark small{display:none}
  .hide-sm{display:none}.show-sm{display:inline}
  .notice-strip{font-size:12px;margin-top:6px}
  .app{margin-top:12px}.app-head{padding:12px 16px 10px}.context{padding:8px 16px;gap:6px}.app-main{padding:18px 16px 24px}
}

select,.field select{appearance:none;-webkit-appearance:none;background-color:var(--paper);background-image:var(--chev);background-repeat:no-repeat;background-position:right 12px center;background-size:12px 8px;padding-right:36px}

/* ---------- Version 10 look ---------- */
body{background:var(--ground)}
a{color:var(--cyan)}
h1{font-weight:800;letter-spacing:-.02em;line-height:1.12}
h2{font-weight:700;letter-spacing:-.01em}
.eyebrow{color:var(--acc,var(--clay-ink));letter-spacing:.08em}
.hero-title{font-weight:800}
.c-white{color:var(--ink)}.c-pink{color:var(--pink)}.c-cyan{color:var(--cyan)}.c-lime{color:var(--lime)}.c-orange{color:var(--orange)}
button,select,input,textarea{border-radius:10px}
.primary{background:var(--ink);border-color:var(--ink);color:#fff}

.clay{background:var(--orange);border-color:var(--orange);color:#fff}

.wordmark span.dot,.app-brand span{color:var(--pink)}
.app{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 32px rgba(22,22,29,.08)}

.tab-learn{--acc:var(--cyan)}.tab-opps{--acc:var(--lime)}.tab-create{--acc:var(--pink)}.tab-coach{--acc:var(--orange)}.tab-home{--acc:var(--pink)}
.ws-coach{--acc:var(--orange)}.ws-partner{--acc:var(--lime)}

.person{display:flex;flex-direction:column;gap:6px;padding:18px}

.ws-tabs{gap:6px}

.progress span{background:var(--acc,var(--pink))}

[class*="tab-"] .check input,.workspace .check input{accent-color:var(--ink)}
.ocular-av{width:36px;height:36px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff2e93,#ff8a1f)}
.ocular-msg{display:flex;gap:10px;align-items:flex-start}

.ob-opts{display:flex;flex-wrap:wrap;gap:8px}

.ocular-card .row{gap:10px}

/* Version 11 */
html{scroll-padding-top:80px;scroll-padding-bottom:90px}

/* ---------- toast and rendering ---------- */
let toastTimer;
function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
}
function render(focusTarget) {
  const ae = document.activeElement;
  const key = ae && ae !== document.body ? (ae.id ? '#' + ae.id : ae.dataset && ae.dataset.fk ? ae.dataset.fk : null) : null;
  const sel = ae && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  document.body.classList.toggle('large', S.large);
  document.getElementById('roles').innerHTML = [['guide', 'Guide'], ['app', 'Young person'], ['coach', 'Coach'], ['partner', 'Partner<span class="hide-sm"> organisation</span>']]
    .map(([r, l]) => `<button type="button" data-act="role" data-arg="${r}" data-fk="role:${r}" aria-pressed="${S.role === r}">${l}</button>`).join('');
  const root = document.getElementById('root');
  if (S.role === 'app' && P().ob.done && P().tab === 'coach' && !S.prefs && !S.help) P().unread = 0;
  root.innerHTML = S.role === 'guide' ? viewGuide() : S.role === 'app' ? viewApp() : S.role === 'coach' ? viewCoach() : viewPartner();
  if (focusTarget) {
    const el = document.querySelector(focusTarget);
    if (el) { el.focus({ preventScroll: true }); }
    if (document.activeElement === document.body) { const t = document.getElementById('page-title'); if (t) t.focus({ preventScroll: true }); }
    return;
  }
  if (key) {
    const el = key.startsWith('#') ? document.getElementById(key.slice(1)) : document.querySelector(`[data-fk="${CSS.escape(key)}"]`);
    if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  }
  if (key && document.activeElement === document.body) { const t = document.getElementById('page-title'); if (t) t.focus({ preventScroll: true }); }
}
function go(role, tab) {
  S.role = role;
  if (tab) { P().tab = tab; if (tab === 'coach') P().unread = 0; }
  S.prefs = false; S.help = false; S.complain = false;
  render('#page-title');
  window.scrollTo({ top: 0 });
}

  }).join('')}</div>`;

  const notes = `${pr.under18 ? '<p class="under18">For under-18s this set-up is simple tap choices, not an AI. It keeps nothing else, and Dee checks it with you.</p>' : ''}${inPrison() ? '<p class="fine">In prison, Ocular would run only on an approved device or with staff help.</p>' : ''}`;
  const head = (q) => `<p class="eyebrow">${who} · question ${st} of ${TOTAL}</p><h1 id="page-title" tabindex="-1" class="ob-q">${q}</h1>`;
  let body;
  if (st === 0 && pr.under18) body = `<p class="eyebrow">Set-up</p><h1 id="page-title" tabindex="-1" class="hero-title"><span class="c-white">Hey</span> <span class="c-pink">${esc(pr.name)}.</span></h1>
    ${say('Five quick questions so the app shows you what matters to you. Just tap your answers, and skip anything you like.')}
    ${say(`${pr.coach} is your coach and will check your set-up with you.`)}
    ${notes}<div class="row">${btn("Let's go", 'ob-start', '', 'primary')}${btn('Skip set-up', 'ob-skip', '', 'quiet small')}</div>`;
  else if (st === 0) body = `<p class="eyebrow">Meet Ocular</p><h1 id="page-title" tabindex="-1" class="hero-title"><span class="c-white">Hey</span> <span class="c-pink">${esc(pr.name)}.</span></h1>
    ${say(`I'm <b>Ocular</b>, OCECULAR's AI guide. I'll ask five quick questions so the app shows you what matters to you. Just tap your answers, and skip anything you like.`)}
    ${say(`I'm an AI, not a person. ${pr.coach} is your coach and the person behind everything here. I never decide what you can or can't do.`)}
    ${notes}<div class="row">${btn("Let's go", 'ob-start', '', 'primary')}${btn('Skip set-up', 'ob-skip', '', 'quiet small')}</div>`;
  else if (st === 1) body = `${head('What are you into?')}${suggested}${say('Pick as many as you like. I put these first in Learn and Create.')}${opts(INTERESTS, 'interests', true, 'Interests')}${nav()}`;

  else if (st === 4) body = `${head(`When is best to hear from ${pr.coach}?`)}${inPrison() ? say(`While you're in prison, messages go through the prison's approved route, so ${pr.coach} will fit around that.`) : say(`${pr.coach} will try to fit around you.`)}${opts(CONTACT_TIMES, 'contact', false, 'Best time to hear from your coach')}${nav()}`;
  else if (st === 5) body = `${head('Is anything making things hard right now?')}${say(`Optional. This only changes what you see first. It is not shared unless you say so. If you are not safe, use <b>Help now</b> at the top.`)}${opts(HARD_THINGS, 'hard', false, 'What is hard right now')}${nav()}`;

    <label class="field"><span>Description</span><textarea id="pt-summary" data-input="pt:summary" maxlength="300">${esc(d.summary)}</textarea></label>
    ${d.error ? `<p class="fine" role="alert" style="color:var(--crit)"><b>${esc(d.error)}</b></p>` : ''}
    <div><button type="submit" class="primary" data-fk="post">Send to OCOE for review</button></div></form>
  <section class="stack" aria-labelledby="h-yl"><h2 id="h-yl" tabindex="-1">Your listings</h2>
    <div class="table-wrap"><table><thead><tr><th>Listing</th><th>Status</th><th>Saved by</th></tr></thead><tbody>
    ${mine.map(l => `<tr><td>${esc(l.title)}</td><td>${{ open: '<span class="chip good">Live</span>', review: '<span class="chip warn">With OCOE for review</span>', declined: `<span class="chip crit">Declined</span>${l.declineReason ? ` <span class="fine">${esc(l.declineReason)}</span>` : ''}` }[l.status] || ''}</td><td>${l.status === 'open' ? savesFor(l.id) + ' in this demo' : '–'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="card note"><h3>What partners can see</h3><p class="fine">How many people saved a listing, with small numbers shown as "fewer than 5" so no one can be picked out. Never their names, messages or plans. Applications would go through the organisation's own process, with a coach's support if the young person wants it.</p></div>
    <div class="row">${btn('Review it as OCOE', 'role', 'coach', 'small')}${btn('See it in the app', 'jump', 'opps', 'quiet small')}</div>
  </section></div></div>`;
}

/* ---------- actions ---------- */
function addHelper(text, links) { P().thread.push({ from: 'helper', text, links, time: now() }); }
/* Illustrative word list only. It matches whole words, so "skills" or "send it" do not raise a flag, but it will still miss
   many ways people describe harm. A real service needs a tested approach and a person reading every conversation. */
const SG = [
  /\b(not|don['’]?t|do not|never)\s+(feel\s+)?safe\b/i, /\bunsafe\b/i,
  /\b(kill|hurt|harm|cut)(ing)?\s+(myself|me)\b/i, /\bself[\s-]?harm/i, /\bsuicid/i, /\bwant(s|ed)?\s+to\s+die\b/i,
  /\b(end|ending)\s+(it\s+all|my\s+life|everything)\b/i, /\bcan['’]?t\s+go\s+on\b/i, /\bno\s+point\s+(in\s+)?(living|going\s+on)\b/i,
  /\babus(e|ed|es|ing|ive)\b/i, /\b(hit|hits|hitting|beat|beats|beating|batter|batters|punch(es|ed)?|kick(s|ed)?|hurts|touch(es|ed|ing)?)\s+me\b/i, /\b(keep|been|started|am|was)\s+cutting\b/i,
  /\bgoing\s+to\s+(batter|hurt|kill|stab|beat|jump)\s+me\b/i, /\bthreat(en|ened|ening|s)?\b/i,
  /\b(make|makes|made|making|force|forces|forced|forcing)\s+me\s+(to\s+)?(sell|carry|hold|deliver|run|move)\b/i, /\bsell(ing)?\s+for\s+(them|him|her)\b/i,
  /\b(county\s+lines|groom(ed|ing))\b/i, /\b(scared|frightened|afraid)\s+(to\s+go\s+(home|back)|for\s+my\s+life)\b/i
];
const sgMatch = text => SG.some(r => r.test(text));
function sendMessage(text) {
  const p = P(), pr = PR();
  text = text.trim();
  if (!text) { toast('Write a message first.'); return; }
  p.thread.push({ from: 'me', text, time: now(), route: inPrison() });
  p.draft = '';
  if (sgMatch(text)) {
    const f = { n: p.flags.length + 1, text, time: now(), status: 'open', note: '' };
    p.flags.push(f); p.flag = f;
    p.helperPaused = true;
    p.thread.push({ from: 'system', text: `Safeguarding flag raised. ${pr.coach} has been alerted in this demo. Ocular has stopped.`, time: now() });
    p.awaiting = true;
    toast('A person has been alerted in this demo.');
  } else {
    p.awaiting = true;
    toast(`Sent to ${pr.coach} in this demo.`);
  }
}
function act(a, arg, el) {
  const p = P(), pr = PR();
  switch (a) {
    case 'role': if (arg === 'app' && S.role === 'guide') P().tab = P().tab || 'home'; if (arg === 'coach') S.coach = PR().coach; go(arg); return;
    case 'signin': { S.coach = arg; const ids = caseIds(); if (ids.length && !ids.includes(S.who)) S.who = ids[0]; break; }
    case 'help': S.help = !S.help; S.prefs = false; render('#page-title'); window.scrollTo({ top: 0 }); return;
    case 'complain': S.complain = !S.complain; break;
    case 'visit': p.visit = 'requested'; p.thread.push({ from: 'system', text: "Coach visit requested through the prison's visits team (simulated). The prison confirms the date and time.", time: now() }); toast('Visit requested in this demo.'); break;
    case 'pick': S.who = arg; go('app', 'home'); return;
    case 'pick-coach': S.who = arg; render(); return;
    case 'jump': go('app', arg); return;
    case 'tab': go('app', arg); return;
    case 'goto': { const [tab, id] = arg.split(':'); if (tab === 'learn') p.openCourse = id; if (tab === 'opps') { p.oppType = 'All'; p.oppQuery = ''; } go('app', tab); return; }
    case 'prefs': S.prefs = !S.prefs; S.help = false; render('#page-title'); return;
    case 'interest': p.interests = p.interests.includes(arg) ? p.interests.filter(i => i !== arg) : [...p.interests, arg]; break;
    case 'end': reset(); go('guide'); toast('Example ended. All choices cleared.'); return;
    case 'flagclose': {
      const ps = S.people[arg], note = (S.flagNotes[arg] || '').trim();
      if (!note) { toast('Write a closing note first.'); return; }
      ps.flags.forEach(f => { if (f.status !== 'closed') { f.status = 'closed'; f.note = note; } });
      ps.flag = null; ps.helperPaused = false; S.flagNotes[arg] = '';
      ps.thread.push({ from: 'system', text: `${PROFILES[arg].coach} closed the safeguarding flag after checking in. Ocular is back on.`, time: now() }); ps.unread++;
      toast('Flag closed with a note.'); break;
    }
    case 'ob-start': p.ob.step = 1; render('#page-title'); window.scrollTo({ top: 0 }); return;
    case 'ob-back': p.ob.step = Math.max(1, p.ob.step - 1); render('#page-title'); return;
    case 'ob-next': if (p.ob.step >= 6) { p.ob.done = true; p.tab = 'home'; toast(`Ocular has set things up for ${pr.name}.`); } else p.ob.step++; render('#page-title'); window.scrollTo({ top: 0 }); return;
    case 'ob-skip': p.ob.done = true; p.tab = 'home'; toast('Set up with suggested answers. Change them any time in Preferences.'); render('#page-title'); return;
    case 'ob-redo': p.ob.done = false; p.ob.step = 1; S.prefs = false; S.help = false; render('#page-title'); window.scrollTo({ top: 0 }); return;
    case 'ob-pick': {
      const [k, v] = arg.split(':');
      if (k === 'interests' || k === 'goals') p[k] = p[k].includes(v) ? p[k].filter(x => x !== v) : [...p[k], v];
      else p[k] = v;
      break;
    }
    case 'notice': p.notice = ''; render('#h-next'); return;
    case 'save': p.saved[arg] = { status: 'thinking' }; if (findItem(arg).sessions) { p.openCourse = arg; } toast('Saved to My next steps on Home.'); break;
    case 'unsave': delete p.saved[arg]; toast('Removed from your next steps.'); render('#h-next'); return;
    case 'talk': {
      const it = findItem(arg);
      const ask = `Hi ${pr.coach}, can we talk about "${it.title}"? `;
      p.draft = p.draft.trim() ? `${p.draft.trim()}\n${ask}` : ask;
      go('app', 'coach');
      const c = document.getElementById('composer'); if (c) { c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
      return;
    }
    case 'copy': {
      const lines = [`OCECULAR example notes for ${pr.name} (${pr.groupLabel}, ${stageLabel()})`, '', 'My next steps:', ...savedEntries().map(e => `- ${e.item.title}: ${STATUS_TEXT[e.status]}`), '', 'These are fictional example notes from a demonstration.'];
      const text = lines.join('\n');
      const done = () => toast('Notes copied.');
      try { navigator.clipboard.writeText(text).then(done, () => toast('Copy is not available here. Your notes are on this screen.')); } catch (e) { toast('Copy is not available here.'); }
      return;
    }
    case 'course': p.openCourse = p.openCourse === arg ? null : arg; break;
    case 'opptype': p.oppType = arg; break;
    case 'oppclear': p.oppType = 'All'; p.oppQuery = ''; render('#opp-q'); return;
    case 'shareopen': p.share.open = !p.share.open; p.share.error = ''; render(p.share.open ? '#sh-type' : '#page-title'); return;
    case 'mtype': p.mediaType = arg; break;
    case 'media': S.openMedia = arg || null; S.playing = null; render(arg ? '#h-open' : '#h-dir'); if (arg) document.getElementById('now-showing')?.scrollIntoView({ block: 'nearest' }); return;
    case 'play': S.playing = S.playing === arg ? null : arg; break;
    case 'helper': {
      if (arg === 'write') {
        const f = savedEntries().find(e => e.status === 'next') || savedEntries()[0];
        const kept = p.draft.trim();
        p.draft = (kept ? kept + '\n' : '') + (f ? `Hi ${pr.coach}, I would like to talk about "${f.item.title}". What would the first step be, and what do I need to check?` : `Hi ${pr.coach}, I would like to talk about what to do next. Could we look at some options together?`);
        addHelper('I drafted a message in the box below. Change anything you like. Nothing is sent until you press Send.');
        toast('Ocular drafted a message.');
        render('#composer'); return;
      }
      if (arg === 'summary') {
        const lastMe = [...p.thread].reverse().find(m => m.from === 'me'), lastC = [...p.thread].reverse().find(m => m.from === 'coach');
        addHelper(`Summary: you told ${pr.coach} "${lastMe ? lastMe.text : 'nothing yet'}". ${pr.coach}'s last reply: "${lastC ? lastC.text : 'none yet'}". You have ${savedEntries().length} item${savedEntries().length === 1 ? '' : 's'} in My next steps. Check anything important with ${pr.coach}.`);
      }
      if (arg === 'fits') {
        const c = byInterest(COURSES.filter(x => fits(x)))[0], o = byInterest(allOpps().filter(x => fits(x) && x.status === 'open'))[0];
        addHelper(`From OCECULAR's checked courses and listings, these match what you have told the app: "${c.title}" in Learn${o ? ` and "${o.title}" in Opportunities` : ''}. I cannot tell whether you are eligible. ${pr.coach} can check that with you.`, [['Open ' + c.title, 'learn', c.id], ...(o ? [['Open ' + o.title, 'opps', o.id]] : [])]);
      }
      toast('Ocular replied in the conversation.');
      break;
    }
    case 'sgexample': sendMessage(pr.under18 ? "I don't feel safe at home tonight." : inPrison() ? "I don't feel safe on the wing." : "I don't feel safe where I'm staying tonight."); render('#h-flag'); return;
    case 'hoview': p.handover.status = 'review'; p.handover.changed = false; break;
    case 'hocancel': p.handover.status = null; break;
    case 'hosend': p.handover.snapshot = handoverLines(); p.handover.status = 'sent'; p.handovers.push({ n: p.handovers.length + 1, from: coachOf(), to: pr.nextCoach, stage: stageLabel(), status: 'sent', lines: p.handover.snapshot });
      toast(`Shared with ${pr.nextCoach} in this demo.`); break;
    case 'horetry': p.handover.status = null; break;
    case 'ctab': S.coachTab = arg; break;
    case 'suggest': {
      const lastMe = [...p.thread].reverse().find(m => m.from === 'me');
      const topic = lastMe && /"([^"]+)"/.exec(lastMe.text);
      S.coachDrafts[S.who] = topic ? `Thanks, ${pr.name}. Yes, let's talk about "${topic[1]}" at our next session. Before then, I will check the details and what you would need for it, and let you know by Friday.` : `Thanks, ${pr.name}. I have read your message. Let's talk it through at our next session, and I will come back to you by Friday with anything I find out.`;
      S.coachSuggested[S.who] = true; render('#coach-reply'); return;
    }
    case 'mapprove': case 'mchanges': case 'mdecline': {
      const s = S.submissions.find(x => x.id === arg);
      s.status = { mapprove: 'approved', mchanges: 'changes', mdecline: 'declined' }[a];
      s.note = { approved: 'Approved by a reviewer. It now appears in Create for everyone.', changes: 'The reviewer asked: please remove the name of the area you live in, then share it again.', declined: 'The reviewer decided not to publish this. Your coach can talk it through with you.' }[s.status];
      toast({ approved: 'Approved. It now appears in Create.', changes: 'Changes requested.', declined: 'Declined.' }[s.status]);
      break;
    }
    case 'lapprove': case 'ldecline': {
      const l = S.listings.find(x => x.id === arg) || S.opps.find(x => x.id === arg);
      if (a === 'ldecline' && !S.declineReasons[arg]) { toast('Choose a reason before declining.'); return; }
      l.status = a === 'lapprove' ? 'open' : 'declined'; if (a === 'ldecline') l.declineReason = S.declineReasons[arg];
      if (a === 'lapprove' && l.statusNote) l.statusNote = '';
      toast(a === 'lapprove' ? 'Published to Opportunities.' : 'Declined.');
      break;
    }
    case 'hoaccept': S.people[arg].handover.status = 'accepted'; S.people[arg].handovers.slice(-1)[0].status = 'accepted'; S.people[arg].thread.push({ from: 'system', text: `${PROFILES[arg].nextCoach} accepted the handover (simulated).`, time: now() }); S.people[arg].unread++; break;
    case 'hounavail': S.people[arg].handover.status = 'unavailable'; S.people[arg].handovers.slice(-1)[0].status = 'unavailable'; S.people[arg].thread.push({ from: 'system', text: `${PROFILES[arg].nextCoach} is unavailable (simulated). ${coachOf(arg)} stays your contact.`, time: now() }); S.people[arg].unread++; break;
    case 'flagpick': {
      const ps = S.people[arg]; ps.flags.forEach(f => { if (f.status === 'open') f.status = 'picked'; });
      ps.thread.push({ from: 'coach', by: S.coach, text: `I have seen your message and I am dealing with it now. If you are in danger, ${inPrison(arg) ? 'tell a member of staff straight away' : 'call 999'}.`, time: now(), route: inPrison(arg) });
      ps.awaiting = false; ps.unread++; toast(`${PROFILES[arg].name}'s app shows that you picked this up.`);
      break;
    }
    default: return;
  }
  render();
}
function onChange(e) {
  const el = e.target, k = el.dataset.change; if (!k) return;
  const p = P(), pr = PR(), arg = el.dataset.arg;
  switch (k) {
    case 'stage': {
      const before = allOpps().filter(o => fits(o)).map(o => o.id).join();
      p.stage = el.value;
      const lbl = stageLabel(), changed = before !== allOpps().filter(o => fits(o)).map(o => o.id).join();
      p.notice = `You changed to ${lbl.toLowerCase()}. Your saved items, course progress and messages are still here.${changed ? ' The opportunities you see have changed to match where you are now.' : ''}${handoverDue() && coachOf() !== pr.nextCoach ? ' You can share your plan with your next coach from the Coach tab.' : ''}`;
      if (p.handover.status === 'review') p.handover.status = null;
      break;
    }
    case 'large': S.large = el.checked; break;
    case 'obshare': p.ob.share = el.checked; return;
    case 'chk': p.checklist[arg] = el.checked; break;
    case 'rating': S.submissions.find(x => x.id === arg).rating = el.value; return;
    case 'status': if (el.value === 'next') Object.values(p.saved).forEach(v => { if (v.status === 'next') v.status = 'thinking'; }); p.saved[arg].status = el.value; toast('Updated.'); break;
    case 'session': { const [id, i] = arg.split(':'); p.progress[id] = p.progress[id] || []; p.progress[id][+i] = el.checked; if (el.checked && !p.saved[id]) p.saved[id] = { status: 'thinking' }; break; }
    case 'shtype': p.share.type = el.value; return;
    case 'shname': p.share.showName = el.checked; return;
    case 'shc1': p.share.c1 = el.checked; return;
    case 'shc2': p.share.c2 = el.checked; return;
    case 'ho': p.handover.sel[arg] = el.checked; if (p.handover.status === 'sent' || p.handover.status === 'review') { p.handover.status = null; p.handover.changed = true; } break;
    case 'pt:type': S.partner.type = el.value; return;
    case 'pt:minAge': S.partner.minAge = el.value; return;
    case 'decline': S.declineReasons[arg] = el.value; return;
    case 'ptg': S.partner.groups[arg] = el.checked; return;
    default: return;
  }
  render();
}
function onInput(e) {
  const el = e.target, k = el.dataset.input; if (!k) return;
  const p = P();
  if (k === 'draft') p.draft = el.value;
  else if (k === 'coachdraft') S.coachDrafts[S.who] = el.value;
  else if (k.startsWith('flagnote:')) S.flagNotes[k.slice(9)] = el.value;
  else if (k === 'shtitle') p.share.title = el.value;
  else if (k === 'shdesc') p.share.desc = el.value;
  else if (k.startsWith('pt:')) S.partner[k.slice(3)] = el.value;
  else if (k === 'oppq') { p.oppQuery = el.value; render(); }
}
function onSubmit(e) {
  const f = e.target, k = f.dataset.submit; if (!k) return;
  e.preventDefault();
  const p = P(), pr = PR();
  if (k === 'send') { sendMessage(p.draft); render(p.flag && p.flag.status === 'open' ? '#h-flag' : '#composer'); return; }
  if (k === 'coachsend') {
    const t = (S.coachDrafts[S.who] || '').trim(); if (!t) { toast('Write a reply first.'); return; }
    const firstFromReceiver = receiving() && p.handover.status === 'accepted';
    p.thread.push({ from: 'coach', by: S.coach, text: t, time: now(), route: inPrison(), ai: !!S.coachSuggested[S.who] }); p.awaiting = false; p.unread++; S.coachDrafts[S.who] = ''; S.coachSuggested[S.who] = false;
    if (firstFromReceiver) { const old = coachOf(); p.coach = S.coach; p.handover.status = 'done'; p.handovers.slice(-1)[0].status = 'done'; p.thread.push({ from: 'system', text: `${S.coach} is now ${pr.name}'s coach. ${old} has handed over.`, time: now() }); }
    if (p.flag && p.flag.status === 'open') p.flags.forEach(f => { if (f.status === 'open') f.status = 'picked'; });
    toast(`Reply shown in ${pr.name}'s app.`); render('#coach-reply'); return;
  }
  if (k === 'share') {
    const sh = p.share;
    if (!sh.title.trim()) { sh.error = 'Add a title.'; render('#sh-title'); return; }
    if (!sh.c1 || !sh.c2) { sh.error = 'Tick both checks to send it for review.'; render('#sh-c1'); return; }
    S.submissions.push({ id: 'u' + Date.now(), owner: S.who, type: sh.type, title: sh.title.trim(), desc: sh.desc.trim(), showName: sh.showName, status: 'review', hue: S.submissions.length + 2, custody: inPrison(), rating: inPrison() || !pr.under18 ? '16+' : 'All ages' });
    p.share = { open: false, type: 'music', title: '', desc: '', showName: false, c1: false, c2: false, error: '' };
    toast('Sent for review. Approve it in the Coach view.'); render('#h-mine'); return;
  }
  if (k === 'post') {
    const d = S.partner;
    if (!d.title.trim() || !d.summary.trim()) { d.error = 'Add a title and a description.'; render(!d.title.trim() ? '#pt-title' : '#pt-summary'); return; }
    const groups = Object.keys(d.groups).filter(g => d.groups[g]);
    if (!groups.length) { d.error = 'Choose at least one group it suits.'; render('#pt-g-care'); return; }
    if (['Job', 'Apprenticeship'].includes(d.type) && d.minAge === '0') { d.error = 'Jobs and apprenticeships must be 16 and over.'; render('#pt-minage'); return; }
    S.listings.push({ id: 'l' + Date.now(), title: d.title.trim(), org: 'Kestrel Studios', type: d.type, place: d.place.trim(), closes: d.closes, groups, tags: [], summary: d.summary.trim(), minAge: +d.minAge || 0, pay: d.pay.trim(), hours: d.hours.trim(), eligibility: d.eligibility.trim(), check: 'Details provided by the organisation and checked by OCOE.', status: 'review', isNew: true });
    S.partner = { title: '', type: 'Training', place: '', closes: '', summary: '', minAge: '16', pay: '', hours: '', eligibility: '', groups: { prison: false, care: true, neet: true, school: false }, error: '' };
    toast('Sent to OCOE for review.'); render('#h-yl'); return;
  }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset.arg, b); });
document.addEventListener('change', onChange);
document.addEventListener('input', onInput);
document.addEventListener('submit', onSubmit);
document.getElementById('end-btn').addEventListener('click', () => act('end'));
const h = (location.hash || '').slice(1);
if (['app', 'coach', 'partner'].includes(h)) S.role = h;
render();

</script>
</body></html>
